services:
  api:
    build: .
    ports: ["5000:5000"]
    environment: { APP_VERSION: compose, FAULT_RATE: "${FAULT_RATE:-0}", EXTRA_LATENCY_MS: "${EXTRA_LATENCY_MS:-0}" }
  prometheus:
    image: prom/prometheus:v2.54.1
    volumes: ["./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro", "./monitoring/compose-alerts.yml:/etc/prometheus/alerts.yml:ro"]
    ports: ["9090:9090"]
  grafana:
    image: grafana/grafana:11.2.2
    volumes: ["./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro", "./monitoring/grafana/dashboard.json:/var/lib/grafana/dashboards/roomfit.json:ro"]
    ports: ["3000:3000"]
