<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="760" viewBox="0 0 1400 760" role="img" aria-labelledby="title description">
  <title id="title">RoomFit service architecture</title>
  <desc id="description">Clients reach the RoomFit Flask API through a Kubernetes service. Three API replicas run the allocation engine. Prometheus scrapes metrics and Grafana displays dashboards and alerts.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#f8fafc"/><stop offset="1" stop-color="#eef4ff"/></linearGradient>
    <linearGradient id="api" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#2563eb"/><stop offset="1" stop-color="#1d4ed8"/></linearGradient>
    <linearGradient id="observe" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#0f766e"/><stop offset="1" stop-color="#0b5f59"/></linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%"><feDropShadow dx="0" dy="7" stdDeviation="8" flood-color="#16324f" flood-opacity=".14"/></filter>
    <marker id="arrowBlue" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#2563eb"/></marker>
    <marker id="arrowTeal" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#0f766e"/></marker>
  </defs>
  <rect width="1400" height="760" fill="url(#background)"/>
  <rect x="34" y="28" width="1332" height="80" rx="18" fill="#ffffff" stroke="#dbe5f1"/>
  <text x="76" y="70" font-family="Arial, Helvetica, sans-serif" font-size="30" font-weight="700" fill="#102a43">RoomFit deployment architecture</text>
  <text x="76" y="94" font-family="Arial, Helvetica, sans-serif" font-size="16" fill="#62748a">Availability, compatibility allocation, and observable operations</text>
  <rect x="40" y="154" width="910" height="544" rx="24" fill="#ffffff" stroke="#93c5fd" stroke-width="2" stroke-dasharray="8 7"/>
  <rect x="70" y="178" width="260" height="35" rx="17" fill="#dbeafe"/>
  <text x="91" y="202" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="700" fill="#1d4ed8">KUBERNETES CLUSTER · roomfit</text>
  <rect x="1000" y="154" width="326" height="544" rx="24" fill="#ffffff" stroke="#99f6e4" stroke-width="2"/>
  <rect x="1030" y="178" width="218" height="35" rx="17" fill="#ccfbf1"/>
  <text x="1051" y="202" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="700" fill="#0f766e">OBSERVABILITY STACK</text>
  <g filter="url(#shadow)">
    <rect x="82" y="315" width="170" height="116" rx="18" fill="#ffffff" stroke="#94a3b8" stroke-width="2"/>
    <circle cx="119" cy="353" r="17" fill="#e0e7ff"/><path d="M108 368c3-12 19-12 22 0M111 349a8 8 0 1 1 16 0" fill="none" stroke="#4338ca" stroke-width="2.5" stroke-linecap="round"/>
    <text x="146" y="358" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="700" fill="#1e293b">Clients</text>
    <text x="106" y="393" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#64748b">Browser · curl · CI</text>
  </g>
  <path d="M252 373 H348" stroke="#2563eb" stroke-width="3" fill="none" marker-end="url(#arrowBlue)"/>
  <text x="271" y="356" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#2563eb">HTTP :5000</text>
  <g filter="url(#shadow)">
    <rect x="354" y="315" width="190" height="116" rx="18" fill="url(#api)"/>
    <path d="M386 346h30M401 331v30" stroke="#bfdbfe" stroke-width="3" stroke-linecap="round"/>
    <text x="432" y="357" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="700" fill="#ffffff">Service</text>
    <text x="384" y="393" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#dbeafe">roomfit · NodePort</text>
  </g>
  <path d="M544 373 H612" stroke="#2563eb" stroke-width="3" fill="none" marker-end="url(#arrowBlue)"/>
  <text x="557" y="356" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#2563eb">routes</text>
  <rect x="620" y="246" width="285" height="305" rx="20" fill="#eff6ff" stroke="#60a5fa" stroke-width="2"/>
  <text x="648" y="280" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="700" fill="#1d4ed8">ROOMFIT API DEPLOYMENT</text>
  <text x="648" y="302" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#64748b">3 replicas · probes · rolling updates</text>
  <g filter="url(#shadow)">
    <rect x="650" y="328" width="225" height="57" rx="12" fill="#ffffff" stroke="#93c5fd"/><circle cx="676" cy="356" r="8" fill="#22c55e"/><text x="695" y="361" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="700" fill="#1e3a8a">Flask API · Pod 1</text>
    <rect x="650" y="402" width="225" height="57" rx="12" fill="#ffffff" stroke="#93c5fd"/><circle cx="676" cy="430" r="8" fill="#22c55e"/><text x="695" y="435" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="700" fill="#1e3a8a">Flask API · Pod 2</text>
    <rect x="650" y="476" width="225" height="57" rx="12" fill="#ffffff" stroke="#93c5fd"/><circle cx="676" cy="504" r="8" fill="#22c55e"/><text x="695" y="509" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="700" fill="#1e3a8a">Flask API · Pod 3</text>
  </g>
  <rect x="145" y="572" width="620" height="84" rx="16" fill="#f8fafc" stroke="#cbd5e1"/>
  <text x="177" y="607" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="700" fill="#334155">Compatibility and allocation engine</text>
  <text x="177" y="632" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#64748b">Hard constraints → deterministic scoring → room allocation</text>
  <path d="M762 533 V572" stroke="#2563eb" stroke-width="3" fill="none" marker-end="url(#arrowBlue)"/>
  <path d="M875 430 H1000" stroke="#0f766e" stroke-width="3" fill="none" marker-end="url(#arrowTeal)"/>
  <text x="896" y="414" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#0f766e">/metrics scrape</text>
  <g filter="url(#shadow)">
    <rect x="1040" y="280" width="245" height="110" rx="18" fill="url(#observe)"/>
    <text x="1070" y="326" font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="700" fill="#ffffff">Prometheus</text>
    <text x="1070" y="354" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#ccfbf1">Metrics · rules · alerts</text>
    <rect x="1040" y="470" width="245" height="110" rx="18" fill="#ffffff" stroke="#14b8a6" stroke-width="2"/>
    <path d="M1072 541l21-21 19 12 25-31 24 18" fill="none" stroke="#0f766e" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="1175" y="521" font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="700" fill="#134e4a">Grafana</text>
    <text x="1175" y="549" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#64748b">Dashboards · alerts</text>
  </g>
  <path d="M1162 390 V470" stroke="#0f766e" stroke-width="3" fill="none" marker-end="url(#arrowTeal)"/>
  <circle cx="117" cy="718" r="7" fill="#22c55e"/><text x="134" y="724" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#475569">Healthy replica</text>
  <line x1="300" y1="718" x2="337" y2="718" stroke="#2563eb" stroke-width="3" marker-end="url(#arrowBlue)"/><text x="352" y="724" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#475569">Application traffic</text>
  <line x1="565" y1="718" x2="602" y2="718" stroke="#0f766e" stroke-width="3" marker-end="url(#arrowTeal)"/><text x="617" y="724" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#475569">Telemetry flow</text>
</svg>
