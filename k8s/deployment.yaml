apiVersion: apps/v1
kind: Deployment
metadata: { name: roomfit, namespace: roomfit }
spec:
  replicas: 3
  strategy: { type: RollingUpdate, rollingUpdate: { maxSurge: 1, maxUnavailable: 0 } }
  selector: { matchLabels: { app: roomfit } }
  template:
    metadata: { labels: { app: roomfit } }
    spec:
      securityContext: { runAsNonRoot: true, runAsUser: 10001, seccompProfile: { type: RuntimeDefault } }
      containers:
        - name: api
          image: roomfit-allocation-service:v1
          ports: [{ containerPort: 5000 }]
          envFrom: [{ configMapRef: { name: roomfit-config } }]
          resources: { requests: { cpu: 100m, memory: 128Mi }, limits: { cpu: 500m, memory: 256Mi } }
          securityContext: { readOnlyRootFilesystem: true, allowPrivilegeEscalation: false, capabilities: { drop: ["ALL"] } }
          livenessProbe: { httpGet: { path: /health, port: 5000 }, initialDelaySeconds: 5 }
          readinessProbe: { httpGet: { path: /ready, port: 5000 }, initialDelaySeconds: 3 }
